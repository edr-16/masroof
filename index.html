
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصروف | MASROOF</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f4f0;color:#17243b;font-family:Arial,sans-serif;padding:22px}
header{text-align:center;padding:25px 0}
h1{color:#b18a48;font-size:34px;margin:0}
header p{color:#687386}
.card{background:white;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 3px 14px #0000000c}
label{display:block;margin:15px 0 7px;font-weight:bold}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:9px;font-size:17px}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#17243b;color:white;font-size:17px;margin-top:18px}
#result{font-size:25px;color:#b18a48;font-weight:bold;text-align:center;margin-top:20px}
small{color:#777}
</style>
</head>
<body>
<header>
<h1>مصروف</h1>
<p>MASROOF — كل ريال له خطة.</p>
</header>
<div class="card">
<h2>احسب راتبك</h2>
<label>الراتب الشهري (ريال)</label>
<input id="salary" type="number" placeholder="مثلاً 5000">
<label>الالتزامات الشهرية (ريال)</label>
<input id="bills" type="number" placeholder="مثلاً 1500">
<button onclick="calculate()">احسب المتبقي</button>
<div id="result">المتبقي: 0 ريال</div>
</div>
<div class="card">
<h3>حفظ تلقائي</h3>
<small>يتم حفظ الراتب والالتزامات على هذا الجهاز تلقائياً.</small>
</div>
<script>
const salary=document.getElementById("salary");
const bills=document.getElementById("bills");
const result=document.getElementById("result");

salary.value=localStorage.getItem("masroof_salary")||"";
bills.value=localStorage.getItem("masroof_bills")||"";

salary.addEventListener("input",()=>{
localStorage.setItem("masroof_salary",salary.value);
calculate();
});
bills.addEventListener("input",()=>{
localStorage.setItem("masroof_bills",bills.value);
calculate();
});

function calculate(){
const s=Number(salary.value)||0;
const b=Number(bills.value)||0;
result.textContent="المتبقي: "+(s-b).toLocaleString("ar-SA")+" ريال";
}
calculate();
</script>
</body>
</html>
