
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحليل مصروفاتي | مصروف</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f5f4f0;color:#17243b;font-family:Arial,sans-serif}
header{text-align:center;padding:20px}
h1{color:#b18a48;font-size:32px;margin:0}
p{color:#687386}
.card{background:white;padding:18px;border-radius:16px;margin:16px 0;box-shadow:0 3px 14px #0000000c}
.total{text-align:center;background:#17243b;color:white}
.total strong{display:block;font-size:30px;color:#e0bd79;margin-top:10px}
.item{margin:18px 0}
.item-title{display:flex;justify-content:space-between;gap:8px}
.bar{height:12px;background:#eee;border-radius:10px;margin-top:8px;overflow:hidden}
.fill{height:100%;background:#b18a48;border-radius:10px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#17243b;color:white;font-size:16px;margin-top:12px}
small{color:#777}
</style>
</head>
<body>
<header>
<h1>مصروف</h1>
<p>تحليل مصروفاتي</p>
</header>

<div class="card total">
إجمالي مصروفاتك
<strong id="total">0 ريال</strong>
</div>

<div class="card">
<h3>أين تذهب أموالك؟</h3>
<div id="categories"></div>
</div>

<div class="card">
<h3>ملخص المصروفات</h3>
<p id="count">عدد العمليات: 0</p>
<p id="average">متوسط المصروف: 0 ريال</p>
<small>يعرض هذا التحليل المصروفات المسجلة على هذا الجهاز والمتصفح.</small>
</div>

<button onclick="location.href='masroof-new.html'">العودة إلى مصروف</button>

<script>
const monthlyExpenses = JSON.parse(localStorage.getItem('masroof_expenses') || '[]');
const total=expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
const groups={};

expenses.forEach(e=>{
const name=e.category||"أخرى";
groups[name]=(groups[name]||0)+(Number(e.amount)||0);
});

document.getElementById("total").textContent=
total.toLocaleString("ar-SA")+" ريال";

document.getElementById("count").textContent=
"عدد العمليات: "+expenses.length;

document.getElementById("average").textContent=
"متوسط المصروف: "+(expenses.length?Math.round(total/expenses.length):0).toLocaleString("ar-SA")+" ريال";

const container=document.getElementById("categories");
const sorted=Object.entries(groups).sort((a,b)=>b[1]-a[1]);

if(sorted.length===0){
container.textContent="لا توجد مصروفات حتى الآن. أضف مصروفاتك أولاً.";
}else{
sorted.forEach(([name,value])=>{
const percent=total?value/total*100:0;
const item=document.createElement("div");
item.className="item";
const title=document.createElement("div");
title.className="item-title";
const label=document.createElement("span");
label.textContent=name;
const amount=document.createElement("strong");
amount.textContent=value.toLocaleString("ar-SA")+" ريال";
title.append(label,amount);
const bar=document.createElement("div");
bar.className="bar";
const fill=document.createElement("div");
fill.className="fill";
fill.style.width=percent+"%";
bar.appendChild(fill);
const note=document.createElement("small");
note.textContent=percent.toFixed(1)+"% من مصروفاتك";
item.append(title,bar,note);
container.appendChild(item);
});
}
</script>
<div class="card">
<h2>التقرير الشهري</h2>
<p>اختر الشهر لمعرفة مصروفاتك.</p>
<input type="month" id="reportMonth">
<h3>إجمالي المصروفات</h3>
<h2 id="monthlyTotal">0 ريال</h2>
<div id="monthlyDetails"></div>
</div>

<script>
const monthInput = document.getElementById('reportMonth');
const totalBox = document.getElementById('monthlyTotal');
const detailsBox = document.getElementById('monthlyDetails');

const expenses = JSON.parse(localStorage.getItem('masroof_expenses') || '[]');

const now = new Date();
monthInput.value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');

function showMonthlyReport() {
 const month = monthInput.value;
 const filtered = monthlyExpenses.filter(item => {
  const d = new Date(item.date);
  return !isNaN(d) && d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') === month;
 });
 const total = filtered.reduce((sum,item) => sum + Number(item.amount || 0),0);
 totalBox.textContent = total.toFixed(2) + ' ريال';
 const categories = {};
 filtered.forEach(item => {
  const name = item.category || 'أخرى';
  categories[name] = (categories[name] || 0) + Number(item.amount || 0);
 });
 detailsBox.innerHTML = filtered.length
  ? Object.entries(categories).map(([name,value]) => '<p>' + name + ': ' + value.toFixed(2) + ' ريال</p>').join('')
  : '<p>لا توجد مصروفات مسجلة لهذا الشهر.</p>';
}
monthInput.addEventListener('change',showMonthlyReport);
showMonthlyReport();
</script>
</body>
</html>
